# One-command local stack:  docker compose -f infra/docker-compose.yml up --build
name: paya
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: paya
      POSTGRES_PASSWORD: ${PAYA_DB_PASSWORD:-paya-local-only}
      POSTGRES_DB: paya
    ports: ["5432:5432"]
    volumes: ["paya-db:/var/lib/postgresql/data"]   # survives restarts: transaction truth is preserved
    restart: unless-stopped   # after a host reboot the DB must come back too, or the API crash-loops
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paya"]
      interval: 5s
      retries: 10
  # One-shot: migrate the schema as its OWNER and grant the app role data privileges only (ADR-015).
  migrate:
    image: paya-api:local
    build: { context: .., dockerfile: infra/Dockerfile.api }
    command: ["python", "-m", "paya.migrate"]
    environment:
      PAYA_MIGRATION_DATABASE_URL: postgresql+psycopg://paya:${PAYA_DB_PASSWORD:-paya-local-only}@db:5432/paya
      PAYA_DATABASE_URL: postgresql+psycopg://paya_app:${PAYA_APP_DB_PASSWORD:-paya-app-local-only}@db:5432/paya
      PAYA_APP_DB_PASSWORD: ${PAYA_APP_DB_PASSWORD:-paya-app-local-only}
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  api:
    image: paya-api:local
    build: { context: .., dockerfile: infra/Dockerfile.api }
    environment:
      # The API holds the APP role only: it cannot ALTER, DROP, TRUNCATE, disable triggers or rewrite evidence.
      PAYA_DATABASE_URL: postgresql+psycopg://paya_app:${PAYA_APP_DB_PASSWORD:-paya-app-local-only}@db:5432/paya
      PAYA_MIGRATE_ON_START: "false"
      # Staff MFA (ADR-017): unset = required outside demo mode, opt-in in demo mode. Set a real key in production.
      PAYA_MFA_ENFORCED: ${PAYA_MFA_ENFORCED:-}
      PAYA_MFA_ENCRYPTION_KEY: ${PAYA_MFA_ENCRYPTION_KEY:-}
      PAYA_JWT_SECRET: ${PAYA_JWT_SECRET:?set PAYA_JWT_SECRET in .env (32+ random characters)}
      PAYA_DEMO_MODE: ${PAYA_DEMO_MODE:-true}
      PAYA_VELOCITY_MAX_PAYMENTS: ${PAYA_VELOCITY_MAX_PAYMENTS:-5}   # raised only for load tests
      PAYA_RATE_GENERAL_PER_CLIENT_PER_MINUTE: ${PAYA_RATE_GENERAL_PER_CLIENT_PER_MINUTE:-600}   # ADR-016; raised only for load tests
      PAYA_RATE_LOGIN_PER_IP_PER_MINUTE: ${PAYA_RATE_LOGIN_PER_IP_PER_MINUTE:-30}             # the load test signs in 40 customers
      # Payments settled after this UTC hour are expected in the NEXT settlement file (timing difference, no case).
      PAYA_SETTLEMENT_CUTOFF_UTC_HOUR: ${PAYA_SETTLEMENT_CUTOFF_UTC_HOUR:-16}   # 16 = 21:00 Pakistan time
      # Theme 5 stablecoin sandbox: OFF unless set to true. Test tokens on a simulated chain; no rupee conversion.
      PAYA_STABLECOIN_SANDBOX: ${PAYA_STABLECOIN_SANDBOX:-false}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
volumes:
  paya-db:
