[project]
name = "paya"
version = "0.1.0"
description = "Paya - Raast P2M payment assurance platform (academic prototype, synthetic data only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.*",
  "uvicorn[standard]==0.32.*",
  "sqlalchemy==2.0.*",
  "psycopg[binary]==3.2.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "pyjwt==2.*",
  "argon2-cffi==23.*",
]

[project.optional-dependencies]
dev = ["pytest==8.*", "httpx==0.27.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
