[project]
name = "paya"
version = "0.1.0"
description = "Paya - Raast P2M payment assurance platform (academic prototype, synthetic data only)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.165.0",
  "uvicorn[standard]==0.32.*",
  "sqlalchemy==2.0.*",
  "psycopg[binary]==3.2.*",
  "pydantic==2.*",
  "pydantic-settings==2.*",
  "pyjwt==2.*",
  "argon2-cffi==23.*",
  "alembic==1.14.*",                    # schema migrations (ADR-015)
  "cryptography==50.0.*",               # AES-GCM for staff MFA secrets at rest (ADR-017); >=50.0 for PYSEC-2026-3552
  "opencv-python-headless==4.10.0.84",  # onboarding: document checks, QR, YuNet/SFace face models
]

[project.optional-dependencies]
dev = ["pytest==9.0.3", "httpx==0.27.*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.setuptools.package-data]
paya = ["migrations/script.py.mako"]
