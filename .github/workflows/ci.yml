name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: paya
          POSTGRES_PASSWORD: paya-ci-only
          POSTGRES_DB: paya_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U paya" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      # Two roles, as in production (ADR-015): tests run as the restricted app role.
      PAYA_MIGRATION_DATABASE_URL: postgresql+psycopg://paya:paya-ci-only@localhost:5432/paya_test
      PAYA_DATABASE_URL: postgresql+psycopg://paya_app:paya-app-ci-only@localhost:5432/paya_test
      PAYA_APP_DB_PASSWORD: paya-app-ci-only
      PAYA_JWT_SECRET: ci-only-secret-at-least-32-characters-long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]" pip-audit
      - name: Face models (checksums pinned; lets the real-model KYC tests run)
        run: python -m paya.fetch_models models
      - run: python -m pytest -p no:warnings -v
      - run: python docs/architecture/tools/ai_eval.py
      - run: pip-audit --skip-editable

  web:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: web/package-lock.json }
      - run: npm ci
      - run: npm run build

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/Dockerfile.api -t paya-api:ci .
